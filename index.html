<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sasson Group</title>
<meta name="description" content="Sasson Group — links.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120F;
    --surface: #201C17;
    --text: #EDE9E1;
    --text-inverse: #171410;
    --muted: #98938A;
    --border: rgba(237, 233, 225, 0.14);
    --border-strong: rgba(237, 233, 225, 0.34);
    --fill: #EDE9E1;
    --fill-hover: #FBF9F4;
    --accent: #C6A15B;
    --accent-hover: #D6B471;
    --accent-ink: #1C1811;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'Optima', 'Jost', 'Candara', 'Segoe UI', -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 64px 22px 48px;
    position: relative;
  }

  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(14px) saturate(1.05) brightness(0.85);
    transform: scale(1.08);
    z-index: -2;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(198, 161, 91, 0.14), transparent 60%),
      linear-gradient(180deg, rgba(20, 18, 15, 0.72) 0%, rgba(20, 18, 15, 0.86) 45%, rgba(20, 18, 15, 0.94) 100%);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-video { display: none; }
  }

  .shell {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin-bottom: 20px;
    background: rgba(237, 233, 225, 0.03);
  }

  .wordmark {
    font-size: clamp(26px, 6vw, 30px);
    letter-spacing: 0.01em;
    font-weight: 400;
    color: var(--text);
    margin: 0 0 8px;
    text-align: center;
  }

  .tagline {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0 0 30px;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 24px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(198, 161, 91, 0.22), 0 1px 0 rgba(255, 255, 255, 0.25) inset;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .cta:hover, .cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(198, 161, 91, 0.32), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
    outline: none;
  }

  .cta svg { flex-shrink: 0; }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 34px 0 22px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 15px 18px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: var(--fill);
    color: var(--text-inverse);
    font-family: inherit;
    font-size: 15.5px;
    letter-spacing: 0.005em;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05), 0 6px 16px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .link-row .left {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .link-row .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-inverse);
  }

  .link-row .chevron {
    opacity: 0.45;
    flex-shrink: 0;
  }

  a.link-row:hover, a.link-row:focus-visible {
    transform: translateY(-2px);
    background: var(--fill-hover);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05), 0 10px 22px rgba(0, 0, 0, 0.24);
    outline: none;
  }

  .link-row.disabled {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: none;
    cursor: default;
  }

  .link-row.disabled .icon { color: var(--muted); }

  .badge {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  footer {
    margin-top: 52px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.03em;
    text-align: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    .avatar, .wordmark, .tagline, .cta, .divider, .link-row, footer {
      animation: rise 0.5s ease both;
    }
    .wordmark { animation-delay: 0.03s; }
    .tagline { animation-delay: 0.06s; }
    .cta { animation-delay: 0.1s; }
    .divider { animation-delay: 0.14s; }
    .links .link-row:nth-child(1) { animation-delay: 0.17s; }
    .links .link-row:nth-child(2) { animation-delay: 0.21s; }
    .links .link-row:nth-child(3) { animation-delay: 0.25s; }
    .links .link-row:nth-child(4) { animation-delay: 0.29s; }
    .links .link-row:nth-child(5) { animation-delay: 0.33s; }
    footer { animation-delay: 0.4s; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
